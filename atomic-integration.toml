schema = 1
agent = "kiro"
version = "1.0.0"

[requires]
atomic = ">=0.11.0"

[skills-source]
package = "atomic-skills"

[skills]
install = "all"
dst_pattern = "~/.kiro/skills/{name}/SKILL.md"

[[skill]]
src = "AGENTS.md"
dst = "~/.kiro/steering/atomic-agent.md"

[[repo-file]]
src = "AGENTS.md"
dst = "AGENTS.md"
